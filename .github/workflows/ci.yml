name: CI

on:
  push:
    branches: ["main", "master"]
    paths:
      - "Day6/**"
  pull_request:
    branches: ["main", "master"]
    paths:
      - "Day6/**"

defaults:
  run:
    working-directory: Day6

jobs:
  unit-tests:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Day6/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests with coverage
        run: |
          pytest tests/unit \
            --cov=dividend_analysis \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=70 \
            -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: Day6/coverage.xml

  dbt-tests:
    name: dbt Tests
    runs-on: ubuntu-latest
    needs: unit-tests

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Day6/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Seed database via Python pipeline
        run: python -m dividend_analysis.main

      - name: Write dbt profiles
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << 'EOF'
          dbt_dividend:
            target: dev
            outputs:
              dev:
                type: postgres
                host: localhost
                port: 5432
                dbname: postgres
                user: postgres
                password: postgres
                schema: public
                threads: 1
          EOF

      - name: Install dbt-core & adapter
        run: pip install dbt-core dbt-postgres

      - name: dbt deps (install dbt_expectations)
        working-directory: Day6/dbt_dividend
        run: python -m dbt deps

      - name: dbt run
        working-directory: Day6/dbt_dividend
        run: python -m dbt run

      - name: dbt test
        working-directory: Day6/dbt_dividend
        run: python -m dbt test

  gx-tests:
    name: Great Expectations Tests
    runs-on: ubuntu-latest
    needs: unit-tests

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Day6/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Seed database via Python pipeline
        run: python -m dividend_analysis.main

      - name: Run GX tests
        run: pytest tests/gx -v
