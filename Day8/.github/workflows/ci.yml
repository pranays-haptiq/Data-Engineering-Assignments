name: CI – Day8 Nasdaq Dividend (Prefect)

on:
  push:
    branches: ["main", "master"]
    paths: ["Day8/**"]
  pull_request:
    branches: ["main", "master"]
    paths: ["Day8/**"]

defaults:
  run:
    working-directory: Day8

# ── Job 1: Unit tests + coverage (no DB or network required) ─────────────────
jobs:
  unit-tests:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Day8/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests with coverage
        run: |
          pytest tests/unit \
            --cov=dividend_analysis \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=70 \
            -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage
          path: Day8/coverage.xml

# ── Job 2: Prefect pipeline + dbt tests (needs live Postgres) ────────────────
  prefect-and-dbt:
    name: Prefect Pipeline & dbt Tests
    runs-on: ubuntu-latest
    needs: unit-tests

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Day8/requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install dbt-core + postgres adapter
        run: pip install dbt-core dbt-postgres

      - name: Write ~/.dbt/profiles.yml
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << 'EOF'
          dbt_dividend:
            target: dev
            outputs:
              dev:
                type: postgres
                host: localhost
                port: 5432
                dbname: postgres
                user: postgres
                password: postgres
                schema: public
                threads: 1
          EOF

      - name: Run Prefect pipeline (loads data into Postgres)
        run: python -m dividend_analysis.flows.pipeline

      - name: dbt deps (install dbt_expectations)
        working-directory: Day8/dbt_dividend
        run: python -m dbt deps

      - name: dbt run
        working-directory: Day8/dbt_dividend
        run: python -m dbt run

      - name: dbt test
        working-directory: Day8/dbt_dividend
        run: python -m dbt test

# ── Job 3: Great Expectations tests (needs live Postgres) ────────────────────
  gx-tests:
    name: Great Expectations Tests
    runs-on: ubuntu-latest
    needs: prefect-and-dbt

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Day8/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Seed database via Prefect pipeline
        run: python -m dividend_analysis.flows.pipeline

      - name: Run GX tests
        run: pytest tests/gx -v
