version: 2

models:
  - name: fct_dividend_performance
    description: >
      Per-ticker aggregation of dividend events. Shows how often the stock price
      drop on ex-dividend date was less than the dividend amount paid.
    columns:
      - name: ticker
        description: "Stock ticker symbol."
        tests:
          - unique
          - not_null
      - name: total_events
        description: "Total dividend events observed."
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 1
      - name: favorable_pct
        description: "Percentage of events where price_drop < dividend_amount."
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 100
      - name: avg_dividend
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              strictly: true

  - name: best_dividend_tickers
    description: >
      The 2 tickers with the highest percentage of favorable dividend events
      (price drop < dividend amount), requiring at least 3 events.
    columns:
      - name: ticker
        tests:
          - unique
          - not_null
      - name: favorable_pct
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 100

  - name: dividend_history
    description: >
      Full dividend event history for the 2 best tickers over the last 5 years.
    columns:
      - name: ticker
        tests:
          - not_null
      - name: ex_date
        tests:
          - not_null
      - name: dividend_amount
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              strictly: true
